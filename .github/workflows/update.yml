name: 自動更新東森購物特價資料

on:
  # 1. 定時自動執行（使用 UTC 時間，台灣時間為 UTC+8）
  schedule:
    - cron: '0 0 * * *'   # 每天 00:00 UTC = 台灣時間早上 08:00
    - cron: '0 12 * * *'  # 每天 12:00 UTC = 台灣時間晚上 20:00

  # 2. 允許在 GitHub 網頁的 Actions 分頁手動點擊執行
  workflow_dispatch:

# 賦予機器人寫入權限，才能把更新後的 data.json 存回專案
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 取得專案最新程式碼
        uses: actions/checkout@v4

      - name: 2. 設定 Python 3.11 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 安裝爬蟲所需套件
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: 4. 執行東森購物爬蟲程式
        run: |
          python scraper.py

      - name: 5. 自動提交並推送更新後的 data.json
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: 自動更新東森購物特價資料" && git push)
